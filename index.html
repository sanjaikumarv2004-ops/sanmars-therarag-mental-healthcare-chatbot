<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thera-RAG | Clinical Support</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar left-sidebar">
            <div class="brand">
                <i class="fa-solid fa-brain"></i>
                <h2>Thera-RAG</h2>
            </div>
            
            <button class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Session
            </button>

            <div class="history-section">
                <h3>Recent Sessions</h3>
                <ul class="history-list" id="history-list">
                    </ul>
            </div>
        </aside>

        <main class="chat-interface">
            <header class="chat-header">
                <h3 id="current-session-title">New Session</h3>
                <button class="sos-btn" id="sos-btn">
                    <i class="fa-solid fa-phone"></i> Crisis SOS
                </button>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="welcome-message">
                    <p>Hello. I am Thera-RAG. How are you feeling today?</p>
                </div>
            </div>

            <div class="input-container">
                <div class="quick-prompts">
                    <button class="prompt-btn">🧘 Deep Breathing</button>
                    <button class="prompt-btn">🚫 Challenge Thoughts</button>
                    <button class="prompt-btn">💤 Sleep Tips</button>
                </div>
                
                <div class="input-box">
                    <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
                    <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>

        <aside class="sidebar right-sidebar">
            <div class="mood-section">
                <h3>Mood Pulse</h3>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                    <input type="range" id="mood-slider" min="1" max="10" value="5" style="flex: 1;">
                    <span id="mood-value" style="font-weight: bold; color: var(--primary-blue);">5</span>
                </div>
                <button id="log-mood-btn" class="new-chat-btn" style="width: 100%; padding: 8px; margin-bottom: 20px;">Log Mood</button>
                
                <canvas id="moodChart" width="100%" height="150"></canvas>
            </div>
            <div class="summary-section" style="margin-top: 30px;">
                <h3>Session Notes</h3>
                <button id="summarize-btn" class="new-chat-btn" style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: var(--text-dark);">
                    End & Summarize
                </button>
                <div id="summary-display" style="font-size: 0.9rem; color: var(--text-dark); background: var(--bg-main); padding: 15px; border-radius: 8px; display: none; line-height: 1.5; overflow-y: auto; max-height: 250px;">
                </div>
            </div>
        </aside>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
